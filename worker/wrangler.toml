# ─────────────────────────────────────────────────────────────────────────────
# IPTV Bridge — Cloudflare Worker (per-user credentials model)
#
# Isolated User-Agent test deployment. Do not use this config for production.
# ─────────────────────────────────────────────────────────────────────────────

name = "iptvbridge-ua-test"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Serve the existing branded configurator/landing UI (public/) as static assets.
[assets]
directory = "../public"
binding = "ASSETS"

[vars]
TMDB_FALLBACK_KEY = "116f8e56d337e582db8e9eb6733d5cc5"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
